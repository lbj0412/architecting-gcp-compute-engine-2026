/* 클릭 순차 애니메이션 완전 무효화 -&gt; 모든 요소 한 번에 노출 */
* {

  transition: none !important;
}
section *, section ul, section li, section div, section p {
  opacity: 1 !important;
  visibility: visible !important;
}

/* 전반적인 슬라이드 기본 설정 (Pretendard v1.3.9 폰트 적용) */
section {
  font-family: &quot;Pretendard Variable&quot;, Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, &quot;Helvetica Neue&quot;, &quot;Segoe UI&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, sans-serif;

header {

  left: 80px;

  font-weight: 600;
  margin-bottom: 18px;
  letter-spacing: -0.02em;

}

.cover-brand-header {

  gap: 14px;
  margin-bottom: 10px;
  align-self: flex-start;
}
.cover-brand-title {

  font-size: 19px;
  font-weight: 600;
  margin-top: 15px;
  backdrop-filter: blur(10px);
  max-width: 580px;
  text-align: left !important;
  align-self: flex-start;
}

section.lead img {
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
  border: 2px solid rgba(255, 255, 255, 0.25);
}

/* 일반 슬라이드 제목 (H1 &amp; H2) */
h1, h2 {
  color: #1a73e8;
  font-size: 38px;
  font-weight: 800;
  margin-top: 0;
  margin-bottom: 24px;
  letter-spacing: -0.03em;
}

h2::after {
  content: '';
  display: block;
  width: 50px;
  height: 4px;
  background: #1a73e8;
  margin-top: 8px;
  border-radius: 2px;
}

/* 구글 전용 불릿 리스트 */
ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
}
li {
  position: relative;
  padding-left: 30px;
  margin-bottom: 14px;
  font-weight: 500;
  letter-spacing: -0.02em;
  font-size: 21px;
}
li::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 12px;
  width: 8px;
  height: 8px;
  background-color: #1a73e8;
  border-radius: 50%;
}

/* 강사 프로필 전용 한눈에 보이는 리스트 테이블 박스 */
.profile-container {
  background: #ffffff;
  border-radius: 16px;
  padding: 26px 32px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
  border-left: 6px solid #1a73e8;
  margin-top: 10px;
}
.profile-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f1f3f4;
  font-size: 20px;
}
.profile-row:last-child {
  border-bottom: none;
}
.profile-period {
  font-weight: 700;
  color: #1a73e8;
  min-width: 170px;
  letter-spacing: -0.01em;
}
.profile-detail {
  color: #3c4043;
  font-weight: 500;
}

/* 카드 컴포넌트 */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}
.card-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}
.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 20px 24px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
}
.card-title {
  font-size: 19px;
  font-weight: 700;
  color: #1a73e8;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.card-desc {
  font-size: 16px;
  font-weight: 400;
  color: #5f6368;
  line-height: 1.5;
}

/* 17페이지 학습 로드맵 전용 스텝 레이아웃 */
.roadmap-layout {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 20px;
  margin-top: 15px;
}
.roadmap-info-box {
  background: #ffffff;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
}
.roadmap-steps-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.roadmap-step-item {
  background: #ffffff;
  border-radius: 12px;
  padding: 16px 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  border: 1px solid #e8eaed;
  display: flex;
  align-items: center;
  gap: 16px;
}
.roadmap-step-active {
  border: 2px solid #1a73e8;
  background: #e8f0fe;
}
.step-num {
  background: #dadce0;
  color: #3c4043;
  font-weight: 800;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.roadmap-step-active .step-num {
  background: #1a73e8;
  color: #ffffff;
}
.step-text {
  font-size: 17px;
  font-weight: 700;
  color: #202124;
  line-height: 1.3;
}

/* 보안 경고 박스 */
.alert-danger-box {
  background: #fce8e6;
  border-left: 6px solid #ea4335;
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 15px;
}
.alert-danger-title {
  color: #c5221f;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

.alert-warning-box {
  background: #feefc3;
  border-left: 6px solid #fbbc04;
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 15px;
}
.alert-warning-title {
  color: #b06000;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

/* 표(Table) 스타일링 */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
  background: #ffffff;
  font-size: 18px;
  margin-top: 15px;
}
th {
  background: #1a73e8;
  color: #ffffff;
  font-weight: 700;
  padding: 12px 16px;
  text-align: left;
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid #e8eaed;
  color: #3c4043;
}
tr:last-child td { border-bottom: none; }
tr:nth-child(even) { background-color: #f8f9fa; }

section:not(.lead) img {
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(60, 64, 67, 0.15);
}

.badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  background: #e8f0fe;
  color: #1a73e8;
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

/* 구글 상단 4색 브랜드 포인트 라인 (GCP Signature Stripe) */
section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #4285f4 0%, #4285f4 25%, #ea4335 25%, #ea4335 50%, #fbbc05 50%, #fbbc05 75%, #34a853 75%, #34a853 100%);
}

/* 헤더 &amp; 푸터 */
header {
  font-family: &quot;Pretendard Variable&quot;, Pretendard, sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #1a73e8;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  top: 24px;
  left: 80px;
}
footer {
  font-family: &quot;Pretendard Variable&quot;, Pretendard, sans-serif;
  font-size: 12px;
  color: #70757a;
  bottom: 20px;
  left: 80px;
}

/* 01. 표지 타이틀 슬라이드 (Google Cloud Dark Navy Theme - Standardized Layout) */
section.lead {
  background: linear-gradient(135deg, #0b3880 0%, #1557bf 100%);
  color: #ffffff;
  padding: 80px 60px;
  text-align: left !important;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start !important;
}
section.lead header {
  color: #ffffff !important;
  font-weight: 700;
}
section.lead footer {
  color: #e8f0fe !important;
}

section.lead h1 {
  color: #ffffff;
  font-size: 50px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 10px;
  margin-bottom: 12px;
  letter-spacing: -0.03em;
  text-align: left !important;
}
section.lead h3 {
  color: #e8f0fe;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 18px;
  letter-spacing: -0.02em;
  opacity: 0.95;
  text-align: left !important;
}

.cover-brand-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
  align-self: flex-start;
}
.cover-brand-title {
  font-size: 30px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.02em;
}

.cover-guide-box {
  background: rgba(255, 255, 255, 0.15);
  border-left: 4px solid #ffffff;
  border-radius: 8px;
  padding: 12px 18px;
  color: #ffffff !important;
  font-size: 19px;
  font-weight: 600;
  margin-top: 15px;
  backdrop-filter: blur(10px);
  max-width: 580px;
  text-align: left !important;
  align-self: flex-start;
}

section.lead img {
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
  border: 2px solid rgba(255, 255, 255, 0.25);
}

/* 일반 슬라이드 제목 (H1 &amp; H2) */
h1, h2 {
  color: #1a73e8;
  font-size: 38px;
  font-weight: 800;
  margin-top: 0;
  margin-bottom: 24px;
  letter-spacing: -0.03em;
}

h2::after {
  content: '';
  display: block;
  width: 50px;
  height: 4px;
  background: #1a73e8;
  margin-top: 8px;
  border-radius: 2px;
}

/* 구글 전용 불릿 리스트 */
ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
}
li {
  position: relative;
  padding-left: 30px;
  margin-bottom: 14px;
  font-weight: 500;
  letter-spacing: -0.02em;
  font-size: 21px;
}
li::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 12px;
  width: 8px;
  height: 8px;
  background-color: #1a73e8;
  border-radius: 50%;
}

/* 강사 프로필 전용 한눈에 보이는 리스트 테이블 박스 */
.profile-container {
  background: #ffffff;
  border-radius: 16px;
  padding: 26px 32px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
  border-left: 6px solid #1a73e8;
  margin-top: 10px;
}
.profile-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f1f3f4;
  font-size: 20px;
}
.profile-row:last-child {
  border-bottom: none;
}
.profile-period {
  font-weight: 700;
  color: #1a73e8;
  min-width: 170px;
  letter-spacing: -0.01em;
}
.profile-detail {
  color: #3c4043;
  font-weight: 500;
}

/* 카드 컴포넌트 */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}
.card-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}
.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 20px 24px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
}
.card-title {
  font-size: 19px;
  font-weight: 700;
  color: #1a73e8;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.card-desc {
  font-size: 16px;
  font-weight: 400;
  color: #5f6368;
  line-height: 1.5;
}

/* 17페이지 학습 로드맵 전용 스텝 레이아웃 */
.roadmap-layout {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 20px;
  margin-top: 15px;
}
.roadmap-info-box {
  background: #ffffff;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
}
.roadmap-steps-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.roadmap-step-item {
  background: #ffffff;
  border-radius: 12px;
  padding: 16px 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  border: 1px solid #e8eaed;
  display: flex;
  align-items: center;
  gap: 16px;
}
.roadmap-step-active {
  border: 2px solid #1a73e8;
  background: #e8f0fe;
}
.step-num {
  background: #dadce0;
  color: #3c4043;
  font-weight: 800;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.roadmap-step-active .step-num {
  background: #1a73e8;
  color: #ffffff;
}
.step-text {
  font-size: 17px;
  font-weight: 700;
  color: #202124;
  line-height: 1.3;
}

/* 보안 경고 박스 */
.alert-danger-box {
  background: #fce8e6;
  border-left: 6px solid #ea4335;
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 15px;
}
.alert-danger-title {
  color: #c5221f;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

.alert-warning-box {
  background: #feefc3;
  border-left: 6px solid #fbbc04;
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 15px;
}
.alert-warning-title {
  color: #b06000;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

/* 표(Table) 스타일링 */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
  background: #ffffff;
  font-size: 18px;
  margin-top: 15px;
}
th {
  background: #1a73e8;
  color: #ffffff;
  font-weight: 700;
  padding: 12px 16px;
  text-align: left;
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid #e8eaed;
  color: #3c4043;
}
tr:last-child td { border-bottom: none; }
tr:nth-child(even) { background-color: #f8f9fa; }

section:not(.lead) img {
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(60, 64, 67, 0.15);
}

.badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  background: #e8f0fe;
  color: #1a73e8;
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}

section {

}

section::before {

  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #4285f4 0%, #4285f4 25%, #ea4335 25%, #ea4335 50%, #fbbc05 50%, #fbbc05 75%, #34a853 75%, #34a853 100%);
}

/* 헤더 &amp; 푸터 */
header {
  font-family: &quot;Pretendard Variable&quot;, Pretendard, sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #1a73e8;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  top: 24px;
  left: 80px;
}
footer {
  font-family: &quot;Pretendard Variable&quot;, Pretendard, sans-serif;
  font-size: 12px;
  color: #70757a;
  bottom: 20px;
  left: 80px;
}

/* 01. 표지 타이틀 슬라이드 (Google Cloud Dark Navy Theme - Standardized Layout) */
section.lead {
  background: linear-gradient(135deg, #0b3880 0%, #1557bf 100%);
  color: #ffffff;
  padding: 80px 60px;
  text-align: left !important;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start !important;
}
section.lead header {
  color: #ffffff !important;
  font-weight: 700;
}
section.lead footer {
  color: #e8f0fe !important;
}

section.lead h1 {
  color: #ffffff;
  font-size: 50px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 10px;
  margin-bottom: 12px;
  letter-spacing: -0.03em;
  text-align: left !important;
}
section.lead h3 {
  color: #e8f0fe;
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 18px;
  letter-spacing: -0.02em;
  opacity: 0.95;
  text-align: left !important;
}

.cover-brand-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
  align-self: flex-start;
}
.cover-brand-title {
  font-size: 30px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.02em;
}

.cover-guide-box {
  background: rgba(255, 255, 255, 0.15);
  border-left: 4px solid #ffffff;
  border-radius: 8px;
  padding: 12px 18px;
  color: #ffffff !important;
  font-size: 19px;
  font-weight: 600;
  margin-top: 15px;
  backdrop-filter: blur(10px);
  max-width: 580px;
  text-align: left !important;
  align-self: flex-start;
}

section.lead img {
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
  border: 2px solid rgba(255, 255, 255, 0.25);
}

/* 일반 슬라이드 제목 (H1 &amp; H2) */
h1, h2 {
  color: #1a73e8;
  font-size: 38px;
  font-weight: 800;
  margin-top: 0;
  margin-bottom: 24px;
  letter-spacing: -0.03em;
}

h2::after {
  content: '';
  display: block;
  width: 50px;
  height: 4px;
  background: #1a73e8;
  margin-top: 8px;
  border-radius: 2px;
}

/* 구글 전용 불릿 리스트 */
ul {
  list-style: none;
  padding-left: 0;
  margin-top: 0;
}
li {
  position: relative;
  padding-left: 30px;
  margin-bottom: 14px;
  font-weight: 500;
  letter-spacing: -0.02em;
  font-size: 21px;
}
li::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 12px;
  width: 8px;
  height: 8px;
  background-color: #1a73e8;
  border-radius: 50%;
}

/* 강사 프로필 전용 한눈에 보이는 리스트 테이블 박스 */
.profile-container {
  background: #ffffff;
  border-radius: 16px;
  padding: 26px 32px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
  border-left: 6px solid #1a73e8;
  margin-top: 10px;
}
.profile-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f1f3f4;
  font-size: 20px;
}
.profile-row:last-child {
  border-bottom: none;
}
.profile-period {
  font-weight: 700;
  color: #1a73e8;
  min-width: 170px;
  letter-spacing: -0.01em;
}
.profile-detail {
  color: #3c4043;
  font-weight: 500;
}

/* 카드 컴포넌트 */
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}
.card-grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}
.card {
  background: #ffffff;
  border-radius: 14px;
  padding: 20px 24px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
}
.card-title {
  font-size: 19px;
  font-weight: 700;
  color: #1a73e8;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.card-desc {
  font-size: 16px;
  font-weight: 400;
  color: #5f6368;
  line-height: 1.5;
}

/* 17페이지 학습 로드맵 전용 스텝 레이아웃 */
.roadmap-layout {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 20px;
  margin-top: 15px;
}
.roadmap-info-box {
  background: #ffffff;
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(60, 64, 67, 0.08);
  border: 1px solid #e8eaed;
}
.roadmap-steps-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.roadmap-step-item {
  background: #ffffff;
  border-radius: 12px;
  padding: 16px 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
  border: 1px solid #e8eaed;
  display: flex;
  align-items: center;
  gap: 16px;
}
.roadmap-step-active {
  border: 2px solid #1a73e8;
  background: #e8f0fe;
}
.step-num {
  background: #dadce0;
  color: #3c4043;
  font-weight: 800;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.roadmap-step-active .step-num {
  background: #1a73e8;
  color: #ffffff;
}
.step-text {
  font-size: 17px;
  font-weight: 700;
  color: #202124;
  line-height: 1.3;
}

/* 보안 경고 박스 */
.alert-danger-box {
  background: #fce8e6;
  border-left: 6px solid #ea4335;
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 15px;
}
.alert-danger-title {
  color: #c5221f;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

.alert-warning-box {
  background: #feefc3;
  border-left: 6px solid #fbbc04;
  border-radius: 12px;
  padding: 20px 24px;
  margin-top: 15px;
}
.alert-warning-title {
  color: #b06000;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 8px;
}

/* 표(Table) 스타일링 */
table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
  background: #ffffff;
  font-size: 18px;
  margin-top: 15px;
}
th {
  background: #1a73e8;
  color: #ffffff;
  font-weight: 700;
  padding: 12px 16px;
  text-align: left;
}
td {
  padding: 12px 16px;
  border-bottom: 1px solid #e8eaed;
  color: #3c4043;
}
tr:last-child td { border-bottom: none; }
tr:nth-child(even) { background-color: #f8f9fa; }

section:not(.lead) img {
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(60, 64, 67, 0.15);
}

.badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 800;
  background: #e8f0fe;
  color: #1a73e8;
  margin-bottom: 14px;
  letter-spacing: 0.5px;
}
