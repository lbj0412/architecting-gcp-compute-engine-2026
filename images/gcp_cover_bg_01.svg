<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1" flood-color="#202124"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Top Right 3D Cloud & Node Network Group -->
  <g transform="translate(1180, -30)">
    <!-- Light Blue Outer Cloud -->
    <path d="M150 250 C150 170, 240 120, 320 150 C370 80, 480 80, 530 150 C610 130, 690 190, 670 270 C720 330, 670 420, 580 420 L150 420 Z" fill="#d2e3fc" opacity="0.85"/>
    <!-- Green Cloud -->
    <path d="M40 240 C40 160, 120 110, 200 140 C240 80, 340 80, 380 140 C440 120, 510 170, 490 240 L40 240 Z" fill="#34a853" opacity="0.9"/>
    <!-- White Front Overlay Cloud -->
    <path d="M200 200 C200 140, 270 100, 340 130 C380 80, 470 80, 510 130 C560 110, 630 160, 600 220 C640 270, 600 340, 520 340 L200 340 Z" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
    
    <!-- Top Right Node Network Wireframe -->
    <g stroke="#4285f4" stroke-width="2.5" opacity="0.7" fill="none">
      <line x1="420" y1="130" x2="560" y2="50" />
      <line x1="560" y1="50" x2="640" y2="150" />
      <line x1="640" y1="150" x2="480" y2="200" />
      <line x1="560" y1="50" x2="720" y2="220" />
    </g>
    <circle cx="560" cy="50" r="13" fill="#4285f4"/>
    <circle cx="640" cy="150" r="11" fill="#34a853"/>
    <circle cx="720" cy="220" r="14" fill="#ea4335"/>
  </g>

  <!-- Bottom Left 3D Cloud & Node Group -->
  <g transform="translate(-100, 520)">
    <!-- Big Blue Shape Background -->
    <path d="M0 220 C60 90, 200 60, 280 170 C360 90, 470 130, 450 250 L0 550 Z" fill="#4285f4" opacity="0.85"/>
    <!-- Light Blue/White Cloud -->
    <path d="M80 280 C80 190, 170 140, 250 180 C310 110, 420 120, 460 190 C530 180, 590 240, 560 320 L80 320 Z" fill="#e8f0fe" opacity="0.9"/>
    <!-- Yellow 3D Front Cloud -->
    <path d="M160 340 C160 240, 260 190, 340 240 C400 170, 510 180, 550 260 C610 250, 670 320, 630 400 L160 400 Z" fill="#fbbc04" opacity="0.95" filter="url(#shadow)"/>
    <!-- Red Cloud Accent -->
    <path d="M100 420 C100 340, 170 300, 230 340 C280 280, 360 290, 380 350 L100 420 Z" fill="#ea4335" opacity="0.9"/>
    <!-- Green Front accent -->
    <path d="M260 430 C260 380, 310 360, 340 380 C380 350, 430 360, 440 410 L260 430 Z" fill="#34a853" opacity="0.9"/>

    <!-- Bottom Left Node Network Wireframe -->
    <g stroke="#4285f4" stroke-width="2.5" opacity="0.65" fill="none">
      <line x1="80" y1="220" x2="220" y2="170" />
      <line x1="220" y1="170" x2="290" y2="280" />
      <line x1="290" y1="280" x2="150" y2="300" />
      <line x1="150" y1="300" x2="80" y2="220" />
      <line x1="220" y1="170" x2="150" y2="300" />
    </g>
    <circle cx="80" cy="220" r="11" fill="#4285f4"/>
    <circle cx="220" cy="170" r="13" fill="#ea4335"/>
    <circle cx="290" cy="280" r="11" fill="#34a853"/>
    <circle cx="150" cy="300" r="14" fill="#fbbc04"/>
  </g>

  <!-- Right Center 3D Wireframe Watermark Chapter Number -->
  <g transform="translate(1380, 340)" opacity="0.28">
    <text x="0" y="240" font-family="'Google Sans', 'Pretendard', sans-serif" font-size="340" font-weight="300" fill="none" stroke="#4285f4" stroke-width="5" stroke-dasharray="10 6">01</text>
    <!-- Wireframe Nodes & Mesh Lines -->
    <g stroke="#4285f4" stroke-width="2" fill="none">
      <polygon points="50,30 200,-30 290,120 140,180" />
      <line x1="50" y1="30" x2="290" y2="120"/>
      <line x1="200" y1="-30" x2="140" y2="180"/>
      <circle cx="50" cy="30" r="7" fill="#4285f4"/>
      <circle cx="200" cy="-30" r="7" fill="#4285f4"/>
      <circle cx="290" cy="120" r="7" fill="#4285f4"/>
      <circle cx="140" cy="180" r="7" fill="#4285f4"/>
    </g>
  </g>
</svg>