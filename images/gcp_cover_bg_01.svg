<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#f1f3f4"/>
    </linearGradient>
    
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.08" flood-color="#202124"/>
    </filter>
    <filter id="cloud-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.06" flood-color="#202124"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- ==================== TOP RIGHT GRAPHICS GROUP ==================== -->
  <g transform="translate(1220, -40)">
    <!-- Node Wireframe Layer (Behind Clouds) -->
    <g stroke="#4285f4" stroke-width="2.2" opacity="0.45" fill="none">
      <line x1="280" y1="220" x2="440" y2="110"/>
      <line x1="440" y1="110" x2="580" y2="210"/>
      <line x1="580" y1="210" x2="420" y2="280"/>
      <line x1="440" y1="110" x2="620" y2="80"/>
      <line x1="620" y1="80" x2="580" y2="210"/>
    </g>

    <!-- Light Blue Outer Cloud Layer -->
    <path d="M220 280 C220 180, 310 130, 400 160 C460 90, 580 90, 630 160 C710 140, 790 200, 770 290 C820 350, 770 450, 670 450 L220 450 Z" fill="#d2e3fc" opacity="0.82"/>
    
    <!-- Green Cloud Left Base -->
    <path d="M70 290 C70 190, 160 140, 240 170 C280 100, 400 100, 440 170 C500 150, 580 200, 560 290 L70 290 Z" fill="#34a853" opacity="0.9" filter="url(#cloud-shadow)"/>
    
    <!-- White Top Layer Smooth Cloud -->
    <path d="M250 240 C250 160, 340 120, 420 150 C470 95, 570 95, 610 150 C670 130, 740 180, 710 250 C760 300, 720 380, 630 380 L250 380 Z" fill="#ffffff" opacity="0.96" filter="url(#soft-shadow)"/>

    <!-- Front Node Dots -->
    <circle cx="440" cy="110" r="14" fill="#4285f4"/>
    <circle cx="580" cy="210" r="11" fill="#34a853"/>
    <circle cx="620" cy="80" r="13" fill="#4285f4"/>
    <circle cx="680" cy="310" r="15" fill="#ea4335"/>
  </g>

  <!-- ==================== BOTTOM LEFT GRAPHICS GROUP ==================== -->
  <g transform="translate(-120, 540)">
    <!-- Node Wireframe Layer (Behind Clouds) -->
    <g stroke="#4285f4" stroke-width="2.2" opacity="0.45" fill="none">
      <line x1="120" y1="240" x2="260" y2="180"/>
      <line x1="260" y1="180" x2="350" y2="300"/>
      <line x1="350" y1="300" x2="190" y2="320"/>
      <line x1="190" y1="320" x2="120" y2="240"/>
      <line x1="260" y1="180" x2="190" y2="320"/>
    </g>

    <!-- Large Soft Blue Background Curve -->
    <path d="M0 240 C80 100, 240 70, 320 190 C410 100, 530 140, 500 270 L0 600 Z" fill="#4285f4" opacity="0.75"/>
    
    <!-- Light Blue Accent Layer -->
    <path d="M90 300 C90 200, 190 150, 270 190 C340 120, 460 130, 500 200 C580 190, 640 250, 610 340 L90 340 Z" fill="#e8f0fe" opacity="0.88"/>
    
    <!-- Yellow 3D Front Cloud -->
    <path d="M190 360 C190 250, 300 200, 380 250 C450 170, 570 180, 610 270 C680 260, 740 330, 690 420 L190 420 Z" fill="#fbbc04" opacity="0.94" filter="url(#soft-shadow)"/>
    
    <!-- Red Cloud Accent -->
    <path d="M120 440 C120 350, 200 310, 270 350 C330 280, 420 290, 450 360 L120 440 Z" fill="#ea4335" opacity="0.92"/>
    
    <!-- Green Accent Bottom Front -->
    <path d="M290 450 C290 390, 350 370, 390 390 C430 350, 490 360, 500 420 L290 450 Z" fill="#34a853" opacity="0.92"/>

    <!-- Front Node Dots -->
    <circle cx="120" cy="240" r="12" fill="#4285f4"/>
    <circle cx="260" cy="180" r="14" fill="#ea4335"/>
    <circle cx="350" cy="300" r="12" fill="#34a853"/>
    <circle cx="190" cy="320" r="15" fill="#fbbc04"/>
  </g>

  <!-- ==================== RIGHT CENTER CHAPTER NUMBER WATERMARK ==================== -->
  <g transform="translate(1420, 350)" opacity="0.25">
    <!-- Chapter Number Watermark Outline -->
    <text x="0" y="250" font-family="'Google Sans', 'Pretendard', sans-serif" font-size="360" font-weight="300" fill="none" stroke="#4285f4" stroke-width="4.5" stroke-dasharray="12 6">01</text>
    
    <!-- Geometric Wireframe Polygon & Nodes -->
    <g stroke="#4285f4" stroke-width="1.8" fill="none">
      <polygon points="40,20 190,-40 280,110 130,170"/>
      <line x1="40" y1="20" x2="280" y2="110"/>
      <line x1="190" y1="-40" x2="130" y2="170"/>
      <circle cx="40" cy="20" r="6" fill="#4285f4"/>
      <circle cx="190" cy="-40" r="6" fill="#4285f4"/>
      <circle cx="280" cy="110" r="6" fill="#4285f4"/>
      <circle cx="130" cy="170" r="6" fill="#4285f4"/>
    </g>
  </g>
</svg>